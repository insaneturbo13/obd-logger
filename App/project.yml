# XcodeGen spec: `xcodegen generate` in this folder creates OBDLogger.xcodeproj.
# The project file is generated, not committed.
#
# Signing values come from the build command line (see .github/workflows/testflight.yml):
#   BUNDLE_ID_PREFIX=com.yourname DEVELOPMENT_TEAM=ABCDE12345
name: OBDLogger
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    BUNDLE_ID_PREFIX: com.example
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  OBDKit:
    path: ../OBDKit

targets:
  OBDLogger:
    type: application
    platform: iOS
    sources:
      - path: OBDLogger
      - path: Shared
    dependencies:
      - package: OBDKit
      - target: CoolantWidget
    info:
      path: OBDLogger/Info.plist
      properties:
        CFBundleDisplayName: OBD Logger
        # XcodeGen writes a literal "1" unless told otherwise; the TestFlight workflow sets
        # CURRENT_PROJECT_VERSION to its run number so every upload gets a new build number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Same for the version shown in TestFlight; without this every build says 1.0.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: The app connects to your OBD-II Bluetooth adapter to read and record the car's sensors.
        NSLocationWhenInUseUsageDescription: Trips record GPS position and speed alongside the car's sensors, including while the screen is off or another app is in front.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allowing location always lets trips that start while the app is closed record GPS too.
        NSMotionUsageDescription: Trips record air pressure from the barometer to work out road grade alongside the car's sensors.
        NSLocalNetworkUsageDescription: Uploading trips to an InfluxDB server on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lists the app under Share › Open in for CSV files, so a Car Scanner export (or a
        # trip exported on another device) can be sent straight to the importer.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Trip CSV
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).obdlogger
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []

  CoolantWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: OBD Logger
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)" # must match the app's
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).obdlogger.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
