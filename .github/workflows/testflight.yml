name: TestFlight

# Builds, signs and uploads to App Store Connect (internal TestFlight).
# One-time setup is in docs/TESTFLIGHT.md. Needs these repository secrets:
#   APPLE_TEAM_ID          10-character team ID
#   ASC_KEY_ID             App Store Connect API key ID
#   ASC_ISSUER_ID          App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64      the .p8 key file, base64-encoded
#   BUNDLE_ID_PREFIX       e.g. com.yourname (the app becomes <prefix>.obdlogger). A repository
#                          variable of that name works too, but GitHub prints variables in the log.
#
# This repository is public, so its run logs and artifacts are too, and artifacts aren't masked.
# No build log is uploaded: the job log gets xcodebuild's errors and result only, with the values
# above masked and signing identities replaced (tools/redact-build-log.sed).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check configuration
        env:
          HAS_BUNDLE_ID_PREFIX: ${{ secrets.BUNDLE_ID_PREFIX != '' || vars.BUNDLE_ID_PREFIX != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
        run: |
          for v in BUNDLE_ID_PREFIX APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            has="HAS_$v"
            if [ "${!has}" != "true" ]; then echo "::error::$v is not set (see docs/TESTFLIGHT.md)"; exit 1; fi
          done
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Install the API key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Validate API key file
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set +x
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          if [ ! -r "$KEY_PATH" ] || [ ! -s "$KEY_PATH" ]; then
            echo "::error::API key file readability/nonempty check: FAIL"
            exit 1
          fi
          echo "API key file readability/nonempty check: PASS"
          if ! openssl pkcs8 -in "$KEY_PATH" -inform PEM -nocrypt -out /dev/null >/dev/null 2>&1; then
            echo "::error::API key PKCS#8 PEM format check: FAIL"
            exit 1
          fi
          echo "API key PKCS#8 PEM format check: PASS"
          if ! openssl pkey -in "$KEY_PATH" -inform PEM -check -noout -passin pass: >/dev/null 2>&1; then
            echo "::error::API key consistency check: FAIL"
            exit 1
          fi
          echo "API key consistency check: PASS"
      - name: Archive
        env:
          BUNDLE_ID_PREFIX: ${{ secrets.BUNDLE_ID_PREFIX || vars.BUNDLE_ID_PREFIX }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # From here on the log masks the prefix too (it's in the bundle and profile names).
          echo "::add-mask::$BUNDLE_ID_PREFIX"
          cd App
          set -o pipefail
          # The full log stays in RUNNER_TEMP, outside the workspace, and goes with the runner.
          xcodebuild -project OBDLogger.xcodeproj -scheme OBDLogger -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OBDLogger.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" \
            | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" \
            | sed -E -f "$GITHUB_WORKSPACE/tools/redact-build-log.sed" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
      - name: Upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OBDLogger.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | sed -E -f "$GITHUB_WORKSPACE/tools/redact-build-log.sed"

  # Hands the new build to the internal TestFlight group once Apple has processed it.
  # Runs on Linux: waiting on macOS would burn minutes at 10x.
  distribute:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install "pyjwt[crypto]"
      - name: Add the build to the internal testers
        env:
          BUNDLE_ID_PREFIX: ${{ secrets.BUNDLE_ID_PREFIX || vars.BUNDLE_ID_PREFIX }}
          BUILD_NUMBER: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "::add-mask::$BUNDLE_ID_PREFIX"
          umask 077
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          unset ASC_KEY_P8_BASE64
          python3 tools/asc_distribute.py "$BUNDLE_ID_PREFIX.obdlogger" "$BUILD_NUMBER"
