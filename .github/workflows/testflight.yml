name: TestFlight

# Builds, signs and uploads to App Store Connect (internal TestFlight).
# One-time setup is in docs/TESTFLIGHT.md. Needs these repository secrets:
#   APPLE_TEAM_ID          10-character team ID
#   ASC_KEY_ID             App Store Connect API key ID
#   ASC_ISSUER_ID          App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64      the .p8 key file, base64-encoded
# and this repository variable:
#   BUNDLE_ID_PREFIX       e.g. com.yourname (the app becomes <prefix>.obdlogger)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        run: |
          for v in BUNDLE_ID_PREFIX TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see docs/TESTFLIGHT.md)"; exit 1; fi
          done
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Install the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Validate API key file
        run: |
          set +x
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          if [ ! -r "$KEY_PATH" ] || [ ! -s "$KEY_PATH" ]; then
            echo "::error::API key file readability/nonempty check: FAIL"
            exit 1
          fi
          echo "API key file readability/nonempty check: PASS"
          if ! openssl pkcs8 -in "$KEY_PATH" -inform PEM -nocrypt -out /dev/null >/dev/null 2>&1; then
            echo "::error::API key PKCS#8 PEM format check: FAIL"
            exit 1
          fi
          echo "API key PKCS#8 PEM format check: PASS"
          if ! openssl pkey -in "$KEY_PATH" -inform PEM -check -noout -passin pass: >/dev/null 2>&1; then
            echo "::error::API key consistency check: FAIL"
            exit 1
          fi
          echo "API key consistency check: PASS"
      - name: Archive
        run: |
          cd App
          set -o pipefail
          xcodebuild -project OBDLogger.xcodeproj -scheme OBDLogger -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OBDLogger.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OBDLogger.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: App/archive.log
          if-no-files-found: ignore

  # Hands the new build to the internal TestFlight group once Apple has processed it.
  # Runs on Linux: waiting on macOS would burn minutes at 10x.
  distribute:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyjwt[crypto]"
      - name: Add the build to the internal testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$ASC_KEY_PATH"
          python3 tools/asc_distribute.py "${{ vars.BUNDLE_ID_PREFIX }}.obdlogger" "${{ github.run_number }}"
